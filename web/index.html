<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CopilotWatchTower</title>
    <!--
      QWebChannel script is injected by Qt only when the page is loaded
      inside QWebEngineView. We declare it here so the bridge is ready
      before the app boots. When opening in a normal browser (dev mode
      without Qt host) the script load will fail silently — bridge.ts
      handles the missing-transport case with a no-op stub.
    -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
