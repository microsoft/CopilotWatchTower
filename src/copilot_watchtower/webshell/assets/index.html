<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CopilotWatchTower</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fb;
        --surface: #ffffff;
        --surface-muted: #eef2f7;
        --border: #dbe3ef;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --warn: #b45309;
        --danger: #b91c1c;
        --ok: #047857;
        --sidebar-bg: #0b1220;
        --sidebar-fg: #d7e1ee;
        --sidebar-fg-strong: #ffffff;
        --sidebar-border: #1f2a3c;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.06);
        --radius: 10px;
        font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      .app {
        display: grid;
        grid-template-columns: 248px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--sidebar-bg);
        color: var(--sidebar-fg);
        padding: 18px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-right: 1px solid var(--sidebar-border);
      }
      .brand {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 8px;
      }
      .brand .mark {
        width: 36px; height: 36px; border-radius: 8px;
        background: var(--accent); display: grid; place-items: center;
        color: white; font-weight: 700;
      }
      .brand h1 {
        font-size: 15px; margin: 0; color: var(--sidebar-fg-strong);
      }
      .brand small { color: var(--text-muted); font-size: 11px; }
      nav { display: flex; flex-direction: column; gap: 4px; }
      nav .section {
        color: #7dd3fc; font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.04em;
        padding: 14px 8px 4px;
      }
      nav button {
        text-align: left;
        background: transparent; color: var(--sidebar-fg);
        border: 0; border-left: 3px solid transparent;
        padding: 8px 10px; border-radius: 7px;
        font-size: 13px; cursor: pointer;
      }
      nav button:hover { background: #162033; color: white; }
      nav button.active {
        background: #17365d; border-left-color: #38bdf8;
        color: white; font-weight: 600;
      }
      main {
        display: flex; flex-direction: column;
        min-height: 100vh;
      }
      header.page {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 18px 24px;
        display: flex; align-items: center; justify-content: space-between;
      }
      header.page h2 { margin: 0; font-size: 20px; }
      header.page p { margin: 4px 0 0; color: var(--text-muted); font-size: 12px; }
      .ctxbar {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        background: var(--surface); border-bottom: 1px solid var(--border);
        padding: 12px 24px;
      }
      .ctxbar label { font-size: 12px; color: var(--text-muted); }
      .ctxbar input, .ctxbar select {
        font: inherit; padding: 6px 10px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--text);
      }
      .ctxbar input[type="date"] { min-width: 140px; }
      .ctxbar .grow { flex: 1; }
      .ctxbar button {
        padding: 6px 14px; border-radius: 8px;
        background: var(--accent); color: white; border: 0; font-weight: 600;
        cursor: pointer;
      }
      .ctxbar button.secondary {
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border);
      }
      .content { padding: 18px 24px; display: flex; flex-direction: column; gap: 16px; }
      .kpis {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      }
      .kpi {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .kpi .label { font-size: 11px; color: var(--text-muted); }
      .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
      .kpi .sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
      .panels { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
      }
      .card h3 { margin: 0 0 8px; font-size: 13px; }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th, td {
        text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      th { color: var(--text-muted); font-weight: 600; background: var(--surface-muted); position: sticky; top: 0; }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .pill {
        display: inline-block; background: var(--accent-soft); color: #1d4ed8;
        font-size: 11px; padding: 2px 8px; border-radius: 999px;
      }
      .empty {
        color: var(--text-muted); padding: 24px; text-align: center;
        font-size: 13px;
      }
      .bars { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow: auto; }
      .bar-row { display: grid; grid-template-columns: 160px 1fr 60px; align-items: center; gap: 8px; }
      .bar-row .name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
      .bar-row .count { font-size: 12px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .bar-row .track { background: var(--surface-muted); border-radius: 4px; height: 10px; overflow: hidden; }
      .bar-row .fill { background: var(--accent); height: 100%; }
      .footer-note {
        color: var(--text-muted); font-size: 11px; padding: 16px 24px;
      }
      .badge { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--surface-muted); color: var(--text-muted); margin-left: 6px; }
      .row-tools { display: flex; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <div class="mark">CW</div>
          <div>
            <h1>CopilotWatchTower</h1>
            <small id="profile-name">프로필 로딩 중…</small>
          </div>
        </div>
        <nav id="nav"></nav>
      </aside>
      <main>
        <header class="page">
          <div>
            <h2 id="page-title">사용 인사이트</h2>
            <p id="page-subtitle">사용자, 날짜, 앱 단위로 Copilot 활동을 살펴봅니다.</p>
          </div>
          <div class="row-tools">
            <span class="pill" id="status-pill">대기</span>
          </div>
        </header>
        <div class="ctxbar">
          <label>기간</label>
          <input type="date" id="date-from" />
          <span>~</span>
          <input type="date" id="date-to" />
          <label>사용자</label>
          <select id="user-filter"><option value="">(전체)</option></select>
          <label>앱</label>
          <select id="app-filter"><option value="">(전체)</option></select>
          <input type="search" id="search" placeholder="이름 / UPN 검색" class="grow" />
          <button id="apply">조회</button>
          <button id="reset" class="secondary">초기화</button>
        </div>
        <section class="content">
          <div class="kpis">
            <div class="kpi"><div class="label">활성 사용자</div><div class="value" id="kpi-users">—</div><div class="sub" id="kpi-users-sub"></div></div>
            <div class="kpi"><div class="label">스레드</div><div class="value" id="kpi-threads">—</div><div class="sub">선택 범위</div></div>
            <div class="kpi"><div class="label">메시지</div><div class="value" id="kpi-messages">—</div><div class="sub" id="kpi-messages-sub"></div></div>
            <div class="kpi"><div class="label">상위 앱</div><div class="value" id="kpi-top-app">—</div><div class="sub" id="kpi-top-app-sub"></div></div>
          </div>
          <div class="panels">
            <div class="card">
              <h3>사용자 요약</h3>
              <div style="max-height: 360px; overflow:auto;">
                <table id="user-table">
                  <thead><tr>
                    <th>사용자</th><th>UPN</th>
                    <th class="num">활성일</th>
                    <th class="num">스레드</th>
                    <th class="num">메시지</th>
                    <th class="num">프롬프트</th>
                    <th class="num">앱</th>
                    <th>상위 앱</th>
                  </tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            <div class="card">
              <h3>앱별 메시지</h3>
              <div class="bars" id="app-bars"></div>
            </div>
          </div>
          <div class="card">
            <h3>일자별 상세</h3>
            <div style="max-height: 360px; overflow:auto;">
              <table id="daily-table">
                <thead><tr>
                  <th>날짜</th><th>사용자</th>
                  <th class="num">스레드</th>
                  <th class="num">메시지</th>
                  <th class="num">프롬프트</th>
                  <th class="num">응답</th>
                  <th class="num">앱</th>
                  <th>상위 앱</th>
                </tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </section>
        <div class="footer-note">
          이 화면은 React UI가 빌드되기 전에 띄우는 임시 화면입니다. <code>cd web; npm install; npm run build</code>를 실행하면 자동으로 새 UI로 전환됩니다.
        </div>
      </main>
    </div>

    <script>
      const PAGES = [
        { section: "개요", items: [{ key: "insights", label: "사용 인사이트" }] },
        { section: "탐색/분석", items: [{ key: "conversations", label: "대화 탐색" }, { key: "agents", label: "에이전트" }] },
        { section: "거버넌스", items: [{ key: "security", label: "보안/감사" }, { key: "reports", label: "공식 보고서" }] },
        { section: "운영", items: [{ key: "operations", label: "수집/설정" }] },
      ];
      const navEl = document.getElementById("nav");
      PAGES.forEach((sec) => {
        const h = document.createElement("div"); h.className = "section"; h.textContent = sec.section; navEl.appendChild(h);
        sec.items.forEach((item) => {
          const b = document.createElement("button");
          b.textContent = item.label;
          b.dataset.key = item.key;
          if (item.key === "insights") b.classList.add("active");
          b.onclick = () => {
            navEl.querySelectorAll("button").forEach((x) => x.classList.remove("active"));
            b.classList.add("active");
            if (item.key !== "insights") {
              setStatus(item.label + " 화면은 다음 마일스톤에서 추가됩니다.");
            } else {
              setStatus("대기");
            }
          };
          navEl.appendChild(b);
        });
      });

      const $ = (id) => document.getElementById(id);
      const setStatus = (text) => ($("status-pill").textContent = text);
      const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("ko-KR"));

      const today = new Date();
      const before = new Date(); before.setDate(today.getDate() - 30);
      $("date-from").value = before.toISOString().slice(0, 10);
      $("date-to").value = today.toISOString().slice(0, 10);

      $("apply").onclick = refresh;
      $("reset").onclick = () => {
        $("user-filter").value = ""; $("app-filter").value = ""; $("search").value = "";
        refresh();
      };
      $("search").addEventListener("keydown", (e) => { if (e.key === "Enter") refresh(); });

      let bridge = null;
      function whenBridge(cb) {
        if (bridge) return cb(bridge);
        new QWebChannel(qt.webChannelTransport, (channel) => {
          bridge = channel.objects.watchtower;
          cb(bridge);
        });
      }

      whenBridge((b) => {
        b.system_info((raw) => {
          const info = JSON.parse(raw);
          $("profile-name").textContent = info.profile ? "프로필: " + info.profile : "프로필 미지정";
        });
        b.users_in_scope((raw) => {
          const users = JSON.parse(raw);
          const sel = $("user-filter");
          users.forEach((u) => {
            const opt = document.createElement("option");
            opt.value = u.id;
            opt.textContent = u.display_name || u.upn || u.id;
            sel.appendChild(opt);
          });
        });
        refresh();
      });

      function currentFilters() {
        return {
          date_from: $("date-from").value || null,
          date_to: $("date-to").value || null,
          user_id: $("user-filter").value || null,
          app: $("app-filter").value || null,
          search: $("search").value.trim() || null,
        };
      }

      function refresh() {
        if (!bridge) return;
        setStatus("조회 중…");
        const filters = JSON.stringify(currentFilters());
        bridge.analytics_interaction_apps(filters, (raw) => {
          const apps = JSON.parse(raw);
          const sel = $("app-filter");
          const current = sel.value;
          sel.innerHTML = '<option value="">(전체)</option>';
          apps.forEach((a) => {
            const opt = document.createElement("option");
            opt.value = a.value; opt.textContent = a.label; opt.title = a.value;
            sel.appendChild(opt);
          });
          if (current) sel.value = current;
        });
        bridge.analytics_user_activity_overview(filters, (raw) => renderUserOverview(JSON.parse(raw)));
        bridge.analytics_user_daily_activity(filters, (raw) => renderDaily(JSON.parse(raw)));
        bridge.analytics_user_daily_app_usage(filters, (raw) => renderAppBars(JSON.parse(raw)));
        setTimeout(() => setStatus("최신"), 200);
      }

      function renderUserOverview(rows) {
        const tbody = document.querySelector("#user-table tbody");
        tbody.innerHTML = "";
        const active = rows.filter((r) => (r.message_count || 0) > 0);
        const totalThreads = rows.reduce((s, r) => s + (r.thread_count || 0), 0);
        const totalMessages = rows.reduce((s, r) => s + (r.message_count || 0), 0);
        const totalPrompts = rows.reduce((s, r) => s + (r.prompt_count || 0), 0);
        $("kpi-users").textContent = fmt(active.length);
        $("kpi-users-sub").textContent = "대상 " + fmt(rows.length) + "명";
        $("kpi-threads").textContent = fmt(totalThreads);
        $("kpi-messages").textContent = fmt(totalMessages);
        $("kpi-messages-sub").textContent = "프롬프트 " + fmt(totalPrompts) + "건";
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty">표시할 데이터가 없습니다.</td></tr>';
          return;
        }
        rows.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escapeHtml(r.display_name || "")}</td>
            <td>${escapeHtml(r.upn || "")}</td>
            <td class="num">${fmt(r.active_days)}</td>
            <td class="num">${fmt(r.thread_count)}</td>
            <td class="num">${fmt(r.message_count)}</td>
            <td class="num">${fmt(r.prompt_count)}</td>
            <td class="num">${fmt(r.app_count)}</td>
            <td title="${escapeHtml(r.top_app_raw || "")}">${escapeHtml(r.top_app || "")}</td>`;
          tbody.appendChild(tr);
        });
      }

      function renderDaily(rows) {
        const tbody = document.querySelector("#daily-table tbody");
        tbody.innerHTML = "";
        if (!rows.length) {
          tbody.innerHTML = '<tr><td colspan="8" class="empty">표시할 데이터가 없습니다.</td></tr>';
          return;
        }
        rows.forEach((r) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escapeHtml(r.day || "")}</td>
            <td>${escapeHtml(r.display_name || "")}<span class="badge">${escapeHtml(r.upn || "")}</span></td>
            <td class="num">${fmt(r.thread_count)}</td>
            <td class="num">${fmt(r.message_count)}</td>
            <td class="num">${fmt(r.prompt_count)}</td>
            <td class="num">${fmt(r.response_count)}</td>
            <td class="num">${fmt(r.app_count)}</td>
            <td title="${escapeHtml(r.top_app_raw || "")}">${escapeHtml(r.top_app || "")}</td>`;
          tbody.appendChild(tr);
        });
      }

      function renderAppBars(rows) {
        const totals = new Map();
        rows.forEach((r) => {
          const key = r.app || "(unknown)";
          totals.set(key, (totals.get(key) || 0) + (r.message_count || 0));
        });
        const wrap = $("app-bars");
        wrap.innerHTML = "";
        if (!totals.size) {
          wrap.innerHTML = '<div class="empty">수집된 앱이 없습니다.</div>';
          $("kpi-top-app").textContent = "—";
          $("kpi-top-app-sub").textContent = "";
          return;
        }
        const max = Math.max(...totals.values());
        const sorted = [...totals.entries()].sort((a, b) => b[1] - a[1]);
        const top = sorted[0];
        $("kpi-top-app").textContent = top[0];
        $("kpi-top-app-sub").textContent = fmt(top[1]) + " messages";
        sorted.slice(0, 12).forEach(([label, value]) => {
          const row = document.createElement("div"); row.className = "bar-row";
          row.innerHTML = `
            <div class="name" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
            <div class="track"><div class="fill" style="width:${(value / max) * 100}%"></div></div>
            <div class="count">${fmt(value)}</div>`;
          wrap.appendChild(row);
        });
      }

      function escapeHtml(text) {
        return String(text ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }
    </script>
  </body>
</html>
