name: release

# Build a signed MSIX and publish a GitHub Release when a version tag is
# pushed (e.g. `git tag v0.2.0 && git push --tags`). Can also be run
# manually from the Actions tab against the current ref.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Defaults to the tag/ref."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_HOST: ${{ secrets.SM_HOST }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $input = "${{ github.event.inputs.version }}"
          if ($input) {
            $semver = $input
          } elseif ($tag -match '^v(\d+\.\d+\.\d+)$') {
            $semver = $Matches[1]
          } else {
            throw "Cannot determine version from ref '$tag'. Push a vX.Y.Z tag or supply the version input."
          }
          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "appx=$semver.0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $semver (MSIX $semver.0)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web shell
        shell: pwsh
        working-directory: web
        run: |
          npm ci
          npm run build

      # DigiCert KeyLocker (cloud HSM) signing. Configured only when the
      # SM_* secrets are present; otherwise the build proceeds unsigned so
      # the workflow still produces an artifact for testing.
      - name: Setup DigiCert KeyLocker
        id: keylocker
        if: ${{ env.SM_API_KEY != '' }}
        uses: digicert/ssm-code-signing@v1.0.1

      - name: Sync KeyLocker certificates
        id: sign-config
        if: ${{ env.SM_API_KEY != '' }}
        shell: pwsh
        run: |
          smctl windows certsync
          "signing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSIX
        shell: pwsh
        env:
          CWT_PUBLISHER: ${{ secrets.CWT_PUBLISHER }}
          CWT_IDENTITY_NAME: ${{ secrets.CWT_IDENTITY_NAME }}
          CWT_PUBLISHER_DISPLAY_NAME: ${{ secrets.CWT_PUBLISHER_DISPLAY_NAME }}
        run: |
          $publisher = if ($env:CWT_PUBLISHER) { $env:CWT_PUBLISHER } else { "CN=Contoso Tenant Tools" }
          $identity = if ($env:CWT_IDENTITY_NAME) { $env:CWT_IDENTITY_NAME } else { "Contoso.CopilotWatchTower" }
          $displayName = if ($env:CWT_PUBLISHER_DISPLAY_NAME) { $env:CWT_PUBLISHER_DISPLAY_NAME } else { "Contoso Tenant Tools" }

          $buildArgs = @{
            Publisher            = $publisher
            IdentityName         = $identity
            PublisherDisplayName = $displayName
            Version              = "${{ steps.version.outputs.appx }}"
          }
          if ("${{ steps.sign-config.outputs.signing }}" -eq "true" -and $env:SM_CODE_SIGNING_CERT_SHA1_HASH) {
            $buildArgs.CertThumbprint = $env:SM_CODE_SIGNING_CERT_SHA1_HASH
          } else {
            Write-Host "::warning::Signing secrets not configured — producing an UNSIGNED MSIX."
          }
          ./packaging/build-msix.ps1 @buildArgs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotWatchTower-${{ steps.version.outputs.semver }}-msix
          path: dist/CopilotWatchTower.msix

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: CopilotWatchTower ${{ steps.version.outputs.semver }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/CopilotWatchTower.msix
