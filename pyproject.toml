[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-watchtower"
version = "0.1.0"
description = "Tenant-admin desktop GUI for collecting, monitoring, and exporting Microsoft 365 Copilot interaction history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CopilotWatchTower" }]
keywords = ["microsoft365", "copilot", "graph", "tenant-admin", "pyside6"]

[project.urls]
Homepage = "https://github.com/microsoft/CopilotWatchTower"
Repository = "https://github.com/microsoft/CopilotWatchTower"
Issues = "https://github.com/microsoft/CopilotWatchTower/issues"

dependencies = [
    "PySide6>=6.7,<7.0",
    "msal>=1.28",
    "httpx>=0.27",
    "requests>=2.32",
    "playwright>=1.44",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "extract-msg>=0.48",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyinstaller>=6.6",
]

[project.gui-scripts]
copilot-watchtower = "copilot_watchtower.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot_watchtower = [
    "db/*.sql",
    "i18n/*.qm",
    "resources/*",
    "webshell/assets/*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
